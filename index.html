<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>Jeffries Point Live Weather</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #05070a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-items: center; padding: 24px;
    }
    main { width: min(680px, 100%); text-align: center; }
    h1 { font-size: clamp(28px, 7vw, 48px); margin: 0 0 8px; }
    .location { color: #aab2bd; font-size: 18px; margin-bottom: 34px; }
    .card {
      border: 1px solid #29313d; border-radius: 22px; padding: 34px 20px;
      background: #0c1118;
    }
    .label { color: #aab2bd; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
    .temp { font-size: clamp(72px, 24vw, 140px); font-weight: 700; line-height: 1; margin: 14px 0; }
    .status { color: #cbd3dc; font-size: 17px; }
    .note { margin-top: 24px; color: #7f8995; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Jeffries Point Live Weather</h1>
    <div class="location">East Boston, Massachusetts</div>
    <section class="card">
      <div class="label">Current Temperature</div>
      <div class="temp">--.-°</div>
      <div class="status">Live data connection coming next</div>
    </section>
    <div class="note">Mobile dashboard • KMAEASTB68</div>
  </main>
</body>
</html>
